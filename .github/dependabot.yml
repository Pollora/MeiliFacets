version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      # Every @docusaurus/* package must share one version, or the build fails.
      docusaurus:
        patterns: ['@docusaurus/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
